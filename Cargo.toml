[workspace]
resolver = "2"
members = ["crates/cloc-lang", "crates/cloc-core", "crates/cloc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-2.0-or-later"
description = "Count Lines of Code — a Rust port of Al Danial's cloc"
repository = "https://github.com/AlDanial/cloc"

[workspace.dependencies]
cloc-lang = { path = "crates/cloc-lang" }
cloc-core = { path = "crates/cloc-core" }

anyhow = "1"
fancy-regex = "0.14"
memchr = "2"
once_cell = "1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
